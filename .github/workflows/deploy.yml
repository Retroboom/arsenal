name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      # Same stamp deploy.sh applies: a unique service worker version per deploy
      # so returning visitors' offline cache (including hof_arsenal.json) busts.
      - name: Stamp service worker version
        run: sed -i "s/const VERSION = '__BUILD_VERSION__';/const VERSION = '${GITHUB_SHA::7}-${GITHUB_RUN_ID}';/" sw.js

      # cloudflare/pages-action no longer exists; wrangler-action runs the same
      # `wrangler pages deploy` that deploy.sh uses (and picks up functions/).
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=hof-arsenal --branch=main --commit-hash=${{ github.sha }} --commit-dirty=true
